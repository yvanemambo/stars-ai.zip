<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1f">
<title>YvanAI — pas de connexion</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; text-align: center;
    background: radial-gradient(120% 80% at 50% 0%, #0f1534, #070b1f 70%); background-color: #070b1f;
    color: #e9ecfb; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 360px; display: grid; gap: 16px; justify-items: center; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  p { margin: 0; color: #9aa3cf; }
  button { font: 600 15px system-ui, sans-serif; background: #f4c96b; color: #1a1404; border: 0; border-radius: 12px; padding: 13px 22px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #e9ecfb; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Pas de connexion internet</h1>
  <p>YvanAI a besoin d'internet pour te répondre. Vérifie ta connexion (Wi-Fi ou données mobiles), puis réessaie.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
